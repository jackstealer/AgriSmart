services:
  # ML Server
  - type: web
    name: agrismart-ml-server
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    rootDir: ml-server
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: HUGGINGFACE_TOKEN
        sync: false
    healthCheckPath: /health

  # Backend API
  - type: web
    name: agrismart-backend
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 1212
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVER_URL
        sync: false
    healthCheckPath: /api/health
